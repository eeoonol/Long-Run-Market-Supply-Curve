<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>장기 공급곡선</title>

<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --bg:#0e0e12;
  --panel:#16161d;
  --border:#2a2a38;
  --accent1:#f7c948;
  --accent2:#e05c5c;
  --accent3:#5ce0b0;
  --accent4:#5c9ee0;
  --text:#e8e8f0;
  --muted:#888899;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:'Pretendard', sans-serif;
  min-height:100vh;
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
}

h1 {
  font-size:1.1rem;
  color:var(--accent1);
  letter-spacing:0.12em;
  text-transform:uppercase;
  text-align:center;
  border-bottom:1px solid var(--border);
  padding-bottom:12px;
  width:100%;
  max-width:850px;
}

.subtitle {
  font-size:0.78rem;
  color:var(--muted);
  text-align:center;
  margin-top:4px;
}

.container {
  width:100%;
  max-width:850px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px 24px;
}

.section-title {
  font-size:0.75rem;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.1em;
  margin-bottom:14px;
}

.option-grid {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
}

.option-btn {
  background:transparent;
  color:var(--muted);
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:13px 10px;
  font-family:'Pretendard', sans-serif;
  cursor:pointer;
  transition:0.25s;
}

.option-btn strong {
  display:block;
  color:var(--text);
  margin-bottom:4px;
}

.option-btn span {
  font-size:0.7rem;
}

.option-btn.active {
  border-color:var(--accent1);
  background:rgba(247,201,72,0.12);
}

.firms-grid {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.firm-card {
  border-radius:8px;
  padding:10px 14px;
  border:1.5px solid;
  transition:all 0.35s;
  min-width:90px;
  text-align:center;
}

.firm-name {
  font-size:0.85rem;
  font-weight:700;
  margin-bottom:4px;
}

.firm-cost {
  font-size:0.72rem;
  color:var(--muted);
}

.firm-status {
  font-size:0.65rem;
  margin-top:6px;
  font-weight:700;
  letter-spacing:0.05em;
}

.slider-label {
  font-size:0.82rem;
  color:var(--muted);
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price-value {
  font-size:1.1rem;
  color:var(--accent1);
  font-weight:700;
}

input[type=range] {
  width:100%;
  -webkit-appearance:none;
  height:6px;
  border-radius:3px;
  background:var(--border);
  outline:none;
  cursor:pointer;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--accent1);
  box-shadow:0 0 8px rgba(247,201,72,0.5);
}

canvas {
  width:100%;
  height:340px;
  display:block;
  border-radius:6px;
}

.legend {
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  font-size:0.72rem;
  color:var(--muted);
  justify-content:center;
  margin-top:14px;
}

.legend-item {
  display:flex;
  align-items:center;
  gap:6px;
}

.legend-dot {
  width:10px;
  height:10px;
  border-radius:50%;
}

.legend-line {
  width:22px;
  height:3px;
  border-radius:2px;
}

.explanation {
  background:var(--panel);
  border:1px solid var(--border);
  border-left:3px solid var(--accent1);
  border-radius:12px;
  padding:16px 20px;
  font-size:0.88rem;
  line-height:1.75;
  min-height:72px;
}

.explanation strong {
  color:var(--accent1);
}

@media (max-width:700px) {
  .option-grid {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h1>Long-Run Market Supply Curve</h1>
<p class="subtitle">가격(P)을 조절하고 산업 유형별 장기 공급곡선을 비교하세요</p>

<div class="container">

  <div class="panel">
    <div class="section-title">산업 유형 선택</div>
    <div class="option-grid">
      <button class="option-btn active" data-type="constant">
        <strong>Constant-Cost</strong>
        <span>비용 일정 산업 · 수평 LRS</span>
      </button>
      <button class="option-btn" data-type="increasing">
        <strong>Increasing-Cost</strong>
        <span>비용 증가 산업 · 우상향 LRS</span>
      </button>
      <button class="option-btn" data-type="decreasing">
        <strong>Decreasing-Cost</strong>
        <span>비용 감소 산업 · 우하향 LRS</span>
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">기업별 최소 평균비용 AC<sub>min</sub> — 진입 기준</div>
    <div class="firms-grid" id="firmsGrid"></div>
  </div>

  <div class="panel">
    <div class="slider-label">
      <span>시장 가격 (P)</span>
      <span class="price-value" id="priceDisplay">P = 30</span>
    </div>
    <input type="range" id="priceSlider" min="10" max="110" value="30" step="1">
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:0.68rem;color:var(--muted)">
      <span>낮은 가격</span>
      <span>높은 가격</span>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">장기 시장 공급곡선</div>
    <canvas id="supplyCanvas"></canvas>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-line" style="background:var(--accent1)"></div>
        <span>장기 공급곡선</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--accent3)"></div>
        <span>진입한 기업</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--border)"></div>
        <span>미진입 기업</span>
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:none;border-top:2px dashed var(--accent2)"></div>
        <span>현재 가격</span>
      </div>
    </div>
  </div>

  <div class="explanation" id="explanation"></div>

</div>
