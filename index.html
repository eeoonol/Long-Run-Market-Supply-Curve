<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장기 공급곡선 시뮬레이터</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg: #0e0e12;
    --panel: #16161d;
    --border: #2a2a38;
    --accent1: #f7c948;
    --accent2: #e05c5c;
    --accent3: #5ce0b0;
    --accent4: #5c9ee0;
    --text: #e8e8f0;
    --muted: #888899;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  h1 {
    font-size: 1.2rem;
    color: var(--accent1);
    letter-spacing: 0.05em;
    text-align: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    width: 100%;
    max-width: 800px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
    text-align: center;
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 800px;
  }

  .slider-section, .firms-section, .graph-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
  }

  .slider-label {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .price-value {
    font-size: 1.2rem;
    color: var(--accent1);
    font-weight: 700;
  }

  input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent1);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(247,201,72,0.5);
  }

  .section-title {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 14px;
  }

  .firms-grid {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .firm-card {
    border-radius: 8px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    transition: all 0.3s ease;
    flex: 1;
    min-width: 110px;
    text-align: center;
  }

  .firm-name {
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .firm-cost {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .firm-status {
    font-size: 0.7rem;
    margin-top: 6px;
    font-weight: 700;
  }

  canvas {
    width: 100%;
    display: block;
    border-radius: 6px;
  }

  .explanation {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent1);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 0.9rem;
    line-height: 1.75;
    color: var(--text);
  }

  .explanation strong { color: var(--accent1); }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 0.75rem;
    color: var(--muted);
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-line { width: 22px; height: 3px; border-radius: 2px; }
</style>
</head>
<body>

<h1>Long-Run Market Supply Curve</h1>
<p class="subtitle">슬라이더를 움직여 가격 변동에 따른 기업들의 진입과 총 공급량을 확인하세요</p>

<div class="container">
  <!-- Firms -->
  <div class="firms-section">
    <div class="section-title">기업별 최소 평균비용 (AC_min) 및 진입 상태</div>
    <div class="firms-grid" id="firmsGrid"></div>
  </div>

  <!-- Slider -->
  <div class="slider-section">
    <div class="slider-label">
      <span>시장 가격 (P)</span>
      <span class="price-value" id="priceDisplay">P = 30</span>
    </div>
    <input type="range" id="priceSlider" min="10" max="110" value="30" step="1">
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:0.75rem;color:var(--muted)">
      <span>낮은 가격</span><span>높은 가격</span>
    </div>
  </div>

  <!-- Graph -->
  <div class="graph-section">
    <div class="section-title">장기 시장 공급곡선</div>
    <canvas id="supplyCanvas" height="320"></canvas>
    <div class="legend" style="margin-top:14px">
      <div class="legend-item">
        <div class="legend-line" style="background:var(--accent1)"></div>
        <span>장기 공급곡선 (LR Supply)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--accent3)"></div>
        <span>진입한 기업</span>
      </div>
      <div class="legend-item">
        <div class="legend-line" style="border-top:2px dashed var(--accent2); width:22px; height:0;"></div>
        <span>현재 가격 및 시장 공급량</span>
      </div>
    </div>
  </div>

  <!-- Explanation -->
  <div class="explanation" id="explanation"></div>
</div>

<script>
// 원본 배열 데이터 (minAC 기준으로 미리 정렬해두면 로직이 훨씬 간결해집니다)
const firms = [
  { name: 'Firm A', minAC: 20,  color: '#5ce0b0', qty: 15 },
  { name: 'Firm B', minAC: 35,  color: '#5c9ee0', qty: 18 },
  { name: 'Firm C', minAC: 50,  color: '#b05ce0', qty: 22 },
  { name: 'Firm D', minAC: 65,  color: '#e0905c', qty: 25 },
  { name: 'Firm E', minAC: 80,  color: '#e05c5c', qty: 20 },
  { name: 'Firm F', minAC: 95,  color: '#e05c90', qty: 17 },
].sort((a, b) => a.minAC - b.minAC);

// Build firms grid
const grid = document.getElementById('firmsGrid');
firms.forEach((f, i) => {
  const card = document.createElement('div');
  card.className = 'firm-card';
  card.id = `firm-${i}`;
  card.innerHTML = `
    <div class="firm-name" style="color:${f.color}">${f.name}</div>
    <div class="firm-cost">AC<sub>min</sub> = ${f.minAC}</div>
    <div class="firm-status" id="status-${i}">대기중</div>
  `;
  grid.appendChild(card);
});

const canvas = document.getElementById('supplyCanvas');
const ctx = canvas.getContext('2d');

// 공급곡선 좌표 생성
function getSupplyCurvePoints() {
  const pts = [{p: 0, q: 0}];
  let cumQ = 0;
  firms.forEach(f => {
    pts.push({p: f.minAC, q: cumQ});       
    cumQ += f.qty;
    pts.push({p: f.minAC, q: cumQ});       
  });
  pts.push({p: 115, q: cumQ});
  return pts;
}

const supplyPts = getSupplyCurvePoints();
const maxQ = supplyPts[supplyPts.length-1].q + 10;
const maxP = 115;

function toCanvas(p, q, W, H, pad) {
  const x = pad.l + (q / maxQ) * (W - pad.l - pad.r);
  const y = pad.t + (1 - p / maxP) * (H - pad.t - pad.b);
  return {x, y};
}

function draw(price) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.width / dpr;
  const H = canvas.height / dpr;
  const pad = {l:55, r:25, t:20, b:46};

  ctx.clearRect(0,0,W,H);

  // 배경 그리드
  ctx.strokeStyle = '#2a2a3840';
  ctx.lineWidth = 1;
  for(let p=20; p<=100; p+=20) {
    const {x:x0, y} = toCanvas(p, 0, W, H, pad);
    const {x:x1} = toCanvas(p, maxQ, W, H, pad);
    ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  }
  for(let q=20; q<=maxQ; q+=20) {
    const {x, y0} = toCanvas(0, q, W, H, pad);
    const {y:y1} = toCanvas(maxP, q, W, H, pad);
    ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
  }

  // 축 그리기
  ctx.strokeStyle = '#555566';
  ctx.lineWidth = 1.5;
  const origin = toCanvas(0,0,W,H,pad);
  const xEnd = toCanvas(0,maxQ,W,H,pad);
  const yEnd = toCanvas(maxP,0,W,H,pad);
  ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(xEnd.x, origin.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(origin.x, yEnd.y); ctx.stroke();

  // 축 라벨
  ctx.fillStyle = '#888899';
  ctx.font = '11px Pretendard, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Q (시장 공급량)', (origin.x + xEnd.x)/2, H - 8);
  
  ctx.save();
  ctx.translate(16, (origin.y + yEnd.y)/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('P (가격)', 0, 0);
  ctx.restore();

  // ★ [수정] Y축 가격 눈금 정상 위치로 변경
  ctx.fillStyle = '#666677';
  ctx.font = '10px Pretendard';
  ctx.textAlign = 'right';
  firms.forEach(f => {
    const {x, y} = toCanvas(f.minAC, 0, W, H, pad);
    ctx.fillText(f.minAC, x - 6, y + 4);
  });

  // 진입 기업 영역 하이라이트 채우기
  let cumQ2 = 0;
  let currentTotalQ = 0;
  firms.forEach(f => {
    if (price >= f.minAC) {
      const qStart = cumQ2;
      const qEnd = cumQ2 + f.qty;
      const c1 = toCanvas(f.minAC, qStart, W, H, pad);
      const c2 = toCanvas(price, qEnd, W, H, pad);
      ctx.fillStyle = f.color + '15';
      ctx.fillRect(c1.x, c2.y, c2.x - c1.x, origin.y - c2.y);
      cumQ2 = qEnd;
      currentTotalQ = qEnd;
    }
  });

  // 공급 곡선 (노란색 선)
  ctx.beginPath();
  ctx.strokeStyle = '#f7c948';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  supplyPts.forEach((pt, i) => {
    const {x,y} = toCanvas(pt.p, pt.q, W,H,pad);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // ★ [개선] 현재 가격선 및 현재 공급량 가이드 점선
  const curCoord = toCanvas(price, currentTotalQ, W, H, pad);
  ctx.strokeStyle = '#e05c5c';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  
  // 수평 가격선
  ctx.beginPath();
  ctx.moveTo(origin.x, curCoord.y);
  ctx.lineTo(curCoord.x, curCoord.y);
  ctx.stroke();
  
  // 수직 공급량선 (시장에 기업이 하나라도 진입했을 때만 수직선 표시)
  if(currentTotalQ > 0) {
    ctx.beginPath();
    ctx.moveTo(curCoord.x, curCoord.y);
    ctx.lineTo(curCoord.x, origin.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 현재 가격 라벨 표시
  ctx.fillStyle = '#e05c5c';
  ctx.font = 'bold 11px Pretendard, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('P=' + price, origin.x - 6, curCoord.y + 4);

  // 현재 총공급량 라벨 표시
  if(currentTotalQ > 0) {
    ctx.textAlign = 'center';
    ctx.fillText('Q=' + currentTotalQ, curCoord.x, origin.y + 16);
  }

  // 기업 진입점 앵커(도트) 표시
  let cumBefore = 0;
  firms.forEach((f, idx) => {
    const cumAfter = cumBefore + f.qty;
    const entered = price >= f.minAC;
    const {x, y} = toCanvas(f.minAC, cumAfter, W, H, pad);
    
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI*2);
    ctx.fillStyle = entered ? f.color : '#2a2a38';
    ctx.fill();
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if(entered) {
      ctx.fillStyle = f.color;
      ctx.font = '9px Pretendard, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(f.name, x + 6, y - 4);
    }
    cumBefore = cumAfter;
  });
}

function update(price) {
  document.getElementById('priceDisplay').textContent = 'P = ' + price;

  // 기업 카드 상태 업데이트
  let totalQ = 0;
  const enteredNames = [];
  const pendingFirms = [];

  firms.forEach((f, i) => {
    const card = document.getElementById(`firm-${i}`);
    const statusEl = document.getElementById(`status-${i}`);
    const entered = price >= f.minAC;
    
    if (entered) {
      card.style.borderColor = f.color;
      card.style.background = f.color + '12';
      statusEl.textContent = '✓ 진입완료';
      statusEl.style.color = f.color;
      totalQ += f.qty;
      enteredNames.push(f.name);
    } else {
      card.style.borderColor = 'var(--border)';
      card.style.background = 'transparent';
      statusEl.textContent = '대기중';
      statusEl.style.color = 'var(--muted)';
      pendingFirms.push(f);
    }
  });

  draw(price);

  // 하단 안내 텍스트 업데이트
  const expEl = document.getElementById('explanation');
  if(enteredNames.length === 0) {
    expEl.innerHTML = `P = <strong>${price}</strong> 공장 가동 최소 비용(${firms[0].minAC})보다 낮아 아직 진입한 기업이 없습니다. 가격을 더 올려보세요.`;
  } else if(pendingFirms.length > 0) {
    const next = pendingFirms[0];
    expEl.innerHTML = `P = <strong>${price}</strong>: 현재 <strong>${enteredNames.join(', ')}</strong>이(가) 시장에 진입해 총 <strong>${totalQ}</strong>만큼 공급하고 있습니다. 다음 대기 기업인 <strong>${next.name}</strong>은 가격이 <strong>${next.minAC}</strong> 이상으로 올라야 진입합니다.`;
  } else {
    expEl.innerHTML = `P = <strong>${price}</strong>: 모든 기업이 진입에 성공하여 시장 총 공급량은 <strong>${totalQ}</strong>입니다. 장기적으로 개별 기업들의 진입 기준 가격($AC_{min}$)이 다를 때, 시장 전체의 장기 공급곡선은 이처럼 <strong>우상향</strong>하는 계단 형태를 띠게 됩니다.`;
  }
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = (rect.width - 48) * dpr;
  canvas.height = 320 * dpr;
  canvas.style.width = (rect.width - 48) + 'px';
  canvas.style.height = '320px';
  
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  
  update(+document.getElementById('priceSlider').value);
}

document.getElementById('priceSlider').addEventListener('input', e => {
  update(+e.target.value);
});

window.addEventListener('resize', resize);

// 초기 실행 순서 보장
resize();
</script>
</body>
</html>
